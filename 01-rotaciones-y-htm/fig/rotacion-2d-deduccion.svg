    <line x1="110" y1="255" x2="39" y2="128"/>
  </g>
  <text x="243" y="178" fill="#e02424" font-size="15" font-weight="bold" font-style="italic">x̂</text>
  <text x="256" y="182" fill="#e02424" font-size="11" font-weight="bold">B</text>
  <text x="8" y="120" fill="#e02424" font-size="15" font-weight="bold" font-style="italic">ŷ</text>
  <text x="20" y="124" fill="#e02424" font-size="11" font-weight="bold">B</text>

  <!-- angle theta -->
  <path d="M150,255 A40,40 0 0 0 144.6,235" stroke="#333" stroke-width="1.4" fill="none"/>
  <text x="156" y="245" fill="#333" font-size="15" font-style="italic">θ</text>


  </g>
  <text x="288" y="259" fill="#1a56db" font-size="15" font-style="italic">x</text>
  <text x="298" y="263" fill="#1a56db" font-size="11">V</text>
  <text x="96" y="56" fill="#1a56db" font-size="15" font-style="italic">y</text>
  <text x="106" y="60" fill="#1a56db" font-size="11">V</text>

  <!-- B axes (red) -->

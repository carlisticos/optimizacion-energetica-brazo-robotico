  <!-- origin frame labels -->
  <text x="112" y="278" fill="#1a56db" font-size="13">{V}</text>
  <text x="124" y="292" fill="#e02424" font-size="13">{B}</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

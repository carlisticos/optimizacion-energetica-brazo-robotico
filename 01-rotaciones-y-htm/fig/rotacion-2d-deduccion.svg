    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e02424"/></marker>
  </defs>
  <rect x="0" y="0" width="500" height="330" fill="#ffffff"/>

  <!-- projection guides (orange dashed) -->
